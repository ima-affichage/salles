    <!DOCTYPE html>
    <html>
        <head>
            <title>Schedule</title>
            <link rel="stylesheet" href="styles.css">
			<link rel="stylesheet" href="https://use.typekit.net/ehl7xwa.css">
        </head>
        <body>
    <table style="width:100%;border-spacing: 0;">
    <thead>
        <tr>
            <th colspan="5" class="bottom-border" style="width:50%;text-align: right;">Emploi du temps du&nbsp;&nbsp;</th>
			<th colspan="5" class="bottom-border" style="width:50%;text-align: left;">
				<div id="current_date">
					<script>
						const options = { year: 'numeric', month: 'long', day: 'numeric' };
						document.getElementById("current_date").innerHTML = new Date().toLocaleDateString('fr-FR', options);
					</script>
				</div>
			</th>
        </tr>
	</thead>
	</table>
	<table style="width:100%;text-align: center;border-spacing: 0;">
	<thead>
        <tr>
			<th width="11%">Heure</th>
			<th width="24%">Groupe(s)</th>
			<th width="25%">UE</th>
			<th width="24%">Intervenant(s)</th>
			<th width="16%">Salle</th>
        </tr>
    </thead>
	</table>
        </body>
    </html>
