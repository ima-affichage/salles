<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupation des salles</title>
<link rel="stylesheet" href="https://use.typekit.net/ehl7xwa.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fefefe; }
  table { width: 100%; border-spacing: 0; table-layout: fixed; color: #000;
          font-family: "brix-slab", arial; font-weight: 400; font-size: x-large; text-align: center; }
  td { padding: 1em .2em; vertical-align: middle; overflow-wrap: anywhere; }
  tr.p { color: #0077B6; background: #fefefe; }
  tr.i { color: #fefefe; background: #0077B6; }
  #mesure { position: absolute; left: 0; top: 0; width: 100%; visibility: hidden; }
  #msg { display: flex; height: 100vh; align-items: center; justify-content: center; color: #0077B6;
         font-family: "brix-slab", arial; font-size: xx-large; font-weight: 700; }
  #pg { position: fixed; right: 6px; bottom: 4px; background: #ff0; color: #000;
        font: 16px arial; padding: 2px 8px; }
</style>
</head>
<body>
<div id="zone"></div>
<div id="mesure"></div>
<div id="pg" hidden></div>
<script>
/* ===== Réglages ===== */
const MODE_TEST = true;          // true : ignore la date des données et affiche le repère jaune (passer à false en production)
const SECONDES_PAR_PAGE = 10;    // durée d'affichage de chaque page
const HEURE_BASCULE = "13:00";   // limite matin / après-midi

/* ===== Données de test (journée du 02/11) =====
   Format : [début, fin, groupes, UE, enseignants, salles] */
const G46 = ["L3 IMSAT S5 - GR4", "L3 IMSAT S5 - GR5", "L3 IMSAT S5 - GR6"];
const G13 = ["L3 IMSAT S5 - GR1", "L3 IMSAT S5 - GR2", "L3 IMSAT S5 - GR3"];
const M2 = ["4TYB901S M2 Systèmes embarqués S9", "M2 MA IMAA"];
const I3 = ["4TCO703S - IMSC", "4TNS703S - IMAS"];
const API = "IIAPI3-1ère année ENSPIMA";
const DONNEES = { date: "2026-11-02", evenements: [
  ["08:10","10:00","4TNV703S - IMAA","4TNV704U","CAZAURANG Franck","INFO-1"],
  ["08:10","10:00",G46,"4TIM513U","GRACIA Alexandrine","11"],
  ["08:10","10:00",M2,"4TNV914U","GUIRRIEC Maryse","13"],
  ["08:10","10:00","LproMA_Avio","4TSI504U","BOMPAS Jonathan","107"],
  ["08:10","10:00",G13,"4TIM515U","GIREMUS Audrey","116"],
  ["08:10","10:00","LproMA_Struct","4TSI505U","AUBERT Isabelle","208"],
  ["08:10","10:00","4TCO703S - IMSC","4TCO702U","ALBERT Gaëtan","209"],
  ["08:10","11:00",API,"API5","SARACCO Jerome","12"],
  ["08:10","11:45","4TCO901S - M2 ISC","4TCO905U","DELTHEIL Benoit","INFO-4"],
  ["08:10","12:10",["IMAS1","IMAS2"],"4TIM723U","FERREIRA Eva","LABO CND"],
  ["09:00","12:00","IIAPI5 - 3ème année ENSPIMA","API0","LACANETTE Delphine","INFO-2"],
  ["10:20","12:10","M2 MA IMAS","4TNS907U","RODRIGUEZ Samuel","AMPHI ROSE"],
  ["10:20","12:10",G13,"4TIM513U","LEDUC Roxane","11"],
  ["10:20","12:10",["4TNV703S - IMAA","4TYB703S - IMSE"],["4TNV704U","4TYB709U"],"AIRIMITOAIE Tudor Bogdan","13"],
  ["10:20","12:10","LproMA_Avio","4TSI504U","BEUILLÉ Olivier","107"],
  ["10:20","12:10",G46,"4TIM515U","SOBAS Justin","116"],
  ["10:20","12:10",M2,"4TNV914U","GUIRRIEC Maryse","120"],
  ["10:20","12:10","LproMA_Struct","4TSI505U","AUBERT Isabelle","208"],
  ["10:20","12:10","4TCO703S - IMSC","4TCO702U","ALBERT Gaëtan","209"],
  ["11:10","12:30",API,"API5","GAIGNARD Antoine","12"],
  ["13:30","15:20","L3 IMSAT","4TIM513U","GIREMUS Audrey","AMPHI ROSE"],
  ["13:30","15:20",I3,"4TIM720U - Vibrations I","FRANCOIS Pierre","AMPHI GRAND"],
  ["13:30","15:20","LproMA","4TSI503U","ALBERT Gaëtan","107"],
  ["13:30","17:20",M2,"4TNV914U","TANG Thomas","LABO ELECTRONIQUE VHDL"],
  ["13:30","17:20","M2 MA IMAS2","4TNS907U","RODRIGUEZ Samuel","LABO MECANIQUE"],
  ["13:30","17:30",["IMAA1","IMAA2"],"4TNV704U","FARGES Christophe","INFO-1"],
  ["14:00","15:20",API,"API5","GATTI Marc","12"],
  ["15:30","18:20","ENSPIMA 1A - GR1","API5","BOUKIR Samia","INFO-2"],
  ["15:30","18:30","ENSPIMA 1A - GR2","API5","TIRANT Sandrine","12"],
  ["15:40","17:30",I3,"4TIM723U","MALBERT-SAYSSET Nathalie","13"],
  ["15:40","17:30","LproMA","4TSI503U","FRANCOIS Pierre","107"],
  ["15:40","18:30",["L3 IMSAT S5 - GR4","L3 IMSAT S5 - GR5"],"4TIM516U",["DESTIBARDE Jean-Michel","GIRARD Dimitri","VIDAUPORTE François"],["HANGAR DC9","HANGAR MERCURE","HANGAR SALLE 015a"]],
  ["15:40","18:30",["L3 IMSAT S5 - GR2","L3 IMSAT S5 - GR3"],"4TIM516U","MICHAUD Denis",["INFO-3","LABO AVIONIQUE","11"]],
  ["17:15","18:30","Extérieur NOVAE","Conférence","","AMPHI GRAND"]
]};

/* ===== Outils ===== */
const L = x => Array.isArray(x) ? x : (x ? [x] : []);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cell = x => L(x).map(esc).join("<br>");
const paris = () => {
  const d = new Date();
  return {
    jour: d.toLocaleDateString("sv-SE", { timeZone: "Europe/Paris" }),
    heure: d.toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
  };
};
const tranche = () => {
  const p = new URLSearchParams(location.search).get("tranche");   // ?tranche=matin ou ?tranche=apres-midi (pour les essais)
  if (p === "matin" || p === "apres-midi") return p;
  return paris().heure < HEURE_BASCULE ? "matin" : "apres-midi";
};
const lignes = t => DONNEES.evenements
  .filter(e => t === "matin" ? e[0] < HEURE_BASCULE : e[1] > HEURE_BASCULE)
  .sort((a, b) => (a[0] + a[1] + (L(a[5])[0] || "")).localeCompare(b[0] + b[1] + (L(b[5])[0] || "")));
const tr = (e, i) => `<tr class="${i % 2 ? "i" : "p"}"><td>${e[0]} - ${e[1]}</td><td>${cell(e[2])}</td><td>${cell(e[3])}</td><td>${cell(e[4])}</td><td>${cell(e[5])}</td></tr>`;
const tab = h => `<table><colgroup><col style="width:11%"><col style="width:27%"><col style="width:22%"><col style="width:24%"><col style="width:16%"></colgroup><tbody>${h}</tbody></table>`;

/* ===== Affichage ===== */
let pages = [], cur = 0, timer = null, cle = "", version = 0, tCourante = "";

function message(txt) {
  document.getElementById("zone").innerHTML = `<div id="msg">${txt}</div>`;
  document.getElementById("pg").hidden = true;
}

function afficher(ev) {
  document.getElementById("zone").innerHTML = tab(pages[cur].map(i => tr(ev[i], i)).join(""));
  const pg = document.getElementById("pg");
  pg.hidden = !MODE_TEST;
  pg.textContent = `${tCourante} ${cur + 1}/${pages.length}`;
}

async function construire() {
  const v = ++version;
  clearInterval(timer);
  const t = tranche();
  tCourante = t;
  cle = t + paris().jour;
  if (!MODE_TEST && DONNEES.date !== paris().jour) return message("Planning indisponible");
  const ev = lignes(t);
  if (!ev.length) return message("Aucune occupation de salle");

  const m = document.getElementById("mesure");
  m.innerHTML = tab(ev.map(tr).join(""));
  await Promise.race([
    document.fonts.load('24px "brix-slab"'),
    new Promise(r => setTimeout(r, 3000))
  ]).catch(() => {});
  if (v !== version) return;

  const H = window.innerHeight - 2;
  pages = [];
  let page = [], h = 0;
  m.querySelectorAll("tr").forEach((r, i) => {
    const rh = r.offsetHeight;
    if (page.length && h + rh > H) { pages.push(page); page = []; h = 0; }
    page.push(i); h += rh;
  });
  if (page.length) pages.push(page);
  m.innerHTML = "";

  cur = 0;
  afficher(ev);
  if (pages.length > 1) timer = setInterval(() => { cur = (cur + 1) % pages.length; afficher(ev); }, SECONDES_PAR_PAGE * 1000);
}

construire();
setInterval(() => { if (tranche() + paris().jour !== cle) construire(); }, 30000);
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(construire, 300); });
</script>
</body>
</html>
